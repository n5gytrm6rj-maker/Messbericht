/* ---------- Eingabe verlassen oder abbrechen ---------- */
let sitzung = null;           // laufende Eingabe (Schnappschuss für „Eingabe abbrechen“)
const neueIds = new Set();    // in dieser Eingabe neu angelegte Einträge
async function verlasseWizard(ziel){ await saveCur(); sitzung=null; einzelEdit=null; if(kind==='termin'){ termin=cur; } ziel(); }
async function eingabeAbbrechen(){
  if(!sitzung) return;
  const was = ({termin:'Messtermin', objekt:'Messobjekt', messung:'Messung'})[sitzung.kind];
  const neuText = ({termin:'Der neue Messtermin', objekt:'Das neue Messobjekt', messung:'Die neue Messung'})[sitzung.kind];
  if(!confirm(sitzung.neu ? 'Eingabe abbrechen? '+neuText+' wird nicht gespeichert.' : 'Eingabe abbrechen? Die Änderungen dieser Eingabe werden verworfen.')) return;
  clearTimeout(saveTimer);
  const s=sitzung; sitzung=null; einzelEdit=null;
  // in dieser Eingabe hinzugefügte Bilder entfernen
  for(const b of await imgsOf(s.id)) if(!s.bilder.includes(b.id)) await del('bilder', b.id);
  if(s.neu){
    if(s.kind==='termin'){ await del('termine', s.id); cur=null; termin=null; return showHome(); }
    if(s.kind==='objekt'){ await deleteObjektBilder({id:s.id}); await del('objekte', s.id); cur=null; objekt=null; return showTermin(); }
    await del('messungen', s.id); cur=null; return showObjekt();
  }
  await put(storeOf(s.kind), s.snapshot); cur=null;
  if(s.kind==='termin') return showTermin();
  if(s.kind==='objekt') return showObjekt();
  await refresh(); cur=messungen.find(m=>m.id===s.id); kind='messung'; return showReview();
}

let objektKontext=false; // Termin wurde aus der Übersicht eines Messobjekts heraus geöffnet

let einzelEdit=null; // aus der Übersicht eine einzelne Angabe geöffnet → „Speichern“ statt „Weiter“, dann zurück
function sheet(inner, onAction){
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog">${inner}</div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.onclick=e=>{ if(e.target===bg) close(); };
  bg.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>onAction(b.dataset.x, close, b));
  bg.querySelectorAll('[data-x="close"]').forEach(b=>{ if(b.textContent.trim()==='Abbrechen') b.classList.add('abbr'); });
  return {el:bg, close};
}

    <div class="field"><label for="s_messleiter">Messleiter</label>${inp('s_messleiter',settings.messleiter)}</div>
    <h3>Messsysteme</h3>
    ${SYSTEME.map(x=>`<details class="sek" style="margin-bottom:4px"><summary><span class="st">${esc(x.name)}</span><svg class="chev" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="field"><label for="s_${x.id}_g">Gerätetyp</label>${inp('s_'+x.id+'_g',settings.sys[x.id].geraetetyp,true)}</div>
      <div class="field"><label for="s_${x.id}_a">Anti-Aliasing-Filter</label>${inp('s_'+x.id+'_a',settings.sys[x.id].aafilter)}</div>
      <div class="field"><label for="s_${x.id}_r">Abtastrate</label>${inp('s_'+x.id+'_r',settings.sys[x.id].abtastrate)}</div>
      ${SYS_CFG[x.id].sensorText
        ? `<div class="field"><label for="s_${x.id}_s">Sensor (Voreinstellung)</label>${inp('s_'+x.id+'_s',sensorDefault(x.id))}</div>`
        : `<div class="field"><label for="s_${x.id}_s">Sensornummern, durch Komma getrennt</label>${inp('s_'+x.id+'_s',sensorListe(x.id).join(', '))}</div>`}</details>`).join('')}
    <button class="btn" id="resetBtn">Auf Vorlage zurücksetzen</button>
    <p class="muted small" style="margin-top:28px">Alle Messungen und Bilder liegen nur auf diesem Gerät. Fertige Berichte regelmäßig in der Dateien-App sichern.</p>
    <p class="muted small" id="verInfo" style="margin-top:12px">Version: …</p>
  </div>`;
  $('#homeBtn').onclick=showHome;
  // Version = Nummer des aktuell gespeicherten Offline-Stands (sw.js)
  (window.caches ? caches.keys() : Promise.resolve([])).then(ks=>{
    const n=ks.map(k=>(/^messbericht-v(\d+)$/.exec(k)||[])[1]).filter(Boolean).map(Number).sort((a,b)=>b-a)[0];
    const el=$('#verInfo'); if(el) el.textContent='Version: '+(n||'nicht ermittelbar');
  }).catch(()=>{ const el=$('#verInfo'); if(el) el.textContent='Version: nicht ermittelbar'; });
  const bind=(id,fn)=>{ $('#'+id).oninput=e=>{ fn(e.target.value); saveSettings(settings); }; };
  bind('s_firma',v=>settings.firma=v); bind('s_messleiter',v=>settings.messleiter=v);
  SYSTEME.forEach(x=>{ bind('s_'+x.id+'_g',v=>settings.sys[x.id].geraetetyp=v); bind('s_'+x.id+'_a',v=>settings.sys[x.id].aafilter=v); bind('s_'+x.id+'_r',v=>settings.sys[x.id].abtastrate=v); bind('s_'+x.id+'_s',v=>{ if(SYS_CFG[x.id].sensorText) settings.sys[x.id].sensor=v; else settings.sys[x.id].sensoren=v; }); });
  $('#resetBtn').onclick=()=>{ if(confirm('Einstellungen auf die Vorlage zurücksetzen?')){ settings=freshSettings(); saveSettings(settings); showSettings(); } };
}


/* ---------- Bericht / Export ---------- */
let TEMPLATE_BYTES;
function lines(pairs, extra){ const out=pairs.filter(p=>String(p[1]||'').trim()).map(p=>p[0]+': '+String(p[1]).trim()); if(String(extra||'').trim()) out.push(String(extra).trim()); return out.join('\n'); }
const terminOf = m => (termine.find(t=>t.id===m.tid)||{data:{}}).data;
const objektOf = m => (objekte.find(o=>o.id===m.oid)||{data:{}}).data;
function reportFields(m){
  const d=m.data, t=terminOf(m), o=objektOf(m);
  const ohneWetter = ![t.windgeschwindigkeit, t.windrichtung, t.temperatur].some(x=>String(x||'').trim());
  const dateien = arduinoDateien(t,o,d);
  return { __omitRows: ohneWetter ? ['Witterung:','@@windgeschwindigkeit@@','@@windrichtung@@','@@temperatur@@'] : [],
    nummer: [d.nummer, dateien.join('; ')].filter(x=>String(x||'').trim()).join('\n'),
    datum:[fmtDate(t.datum), d.uhrzeit?d.uhrzeit+' Uhr':''].filter(Boolean).join('\n'),
    windgeschwindigkeit:t.windgeschwindigkeit, windrichtung:t.windrichtung, temperatur:fmtTemp(t.temperatur),
    firma:t.firma, messleiter:t.messleiter,
    zweck:o.zweck, messobjekt:[o.messobjekt, o.objekt_notizen, d.mess_notizen, zugkraftText(d.zugkraft)?'Zugkraft: '+zugkraftText(d.zugkraft):''].filter(x=>String(x||'').trim()).join('\n'), ...geraeteFelder(t,d),
    ...sensorFelder(t,o,d), erregung:erregungText(o,d),
    ergaenzungen: lines([['Personenanzahl',d.personen],['Gewicht',d.gewicht],['Erkennbare Quellen',d.amb_quellen],
      ['Impulshammer',d.hammer_typ],['Hammerspitze',d.hammer_spitze],
      ['Glockenanzahl',glockenListe(d).length||''],...glockenListe(d).map(n=>[glockeName(d,n), [d['glocke_'+n+'_masse'], d['glocke_'+n+'_frq']].map(x=>String(x||'').trim()).filter(Boolean).join(', ')]),
      ['Shaker-Signal',d.shaker_signal],['Shaker-Frequenz',d.shaker_frequenz],['Shaker-Kraft',d.shaker_kraft],['Shaker-Position',anschlagWert(o,d,'shaker_ort')],
      ['Unwuchterreger-Frequenz',d.unw_frequenz],['Unwuchtmoment',d.unw_moment],['Unwuchterreger-Position',d.unw_ort]], d.ergaenzungen_sonst),
    notizen: lines([['Spürbarkeit',d.spuerbarkeit],['Sekundäreffekte',d.sekundaer]], d.notizen_sonst) };
}
// Messgeräte aus den beim Termin gewählten Systemen zusammensetzen
function geraeteFelder(t, d){
  const gew = systemeVon(t);
  if(!gew.length) return {geraetetyp:d.geraetetyp, aafilter:d.aafilter, abtastrate:d.abtastrate}; // ältere Messungen
  const mehr = gew.length>1;
  const liste = k => gew.map(x=>[x.name, String(settings.sys[x.id][k]||'').trim()]).filter(p=>p[1])
    .map(([n,v])=> mehr ? n+': '+v : v).join('\n');
  return { geraetetyp: gew.map(x=>String(settings.sys[x.id].geraetetyp||x.name).trim()).join('\n'), aafilter: liste('aafilter'), abtastrate: liste('abtastrate') };
}
// Art der Anregung, bei Personen mit der gewählten Bewegung
function erregungText(o,d){
  const er=erregungenVon(o);
  if(!er.length) return o.erregung||d.erregung||'';
  return er.map(x=> x==='Personen' && d.p_art ? 'Personen ('+d.p_art+')'
    : x==='Impulshammer' && anschlagWert(o,d) ? 'Impulshammer (Anschlagpunkt '+anschlagWert(o,d)+')'
    : x).join(', ');
}
// Arduino-Dateinamen dieser Messung, z. B. 03-0006 (Sensornummer-Datei)
function arduinoDateien(t,o,d){
  if(d.ard_keine) return [];
  if(!systemeVon(t).some(x=>x.id==='arduino')) return [];
  return sensorenVon('arduino',o).map(nr=>{ const f=padNr(d['ard_datei_'+nr],4); return f ? nr+'-'+f : ''; }).filter(Boolean);
}
function fileName(m){ const d=m.data, t=terminOf(m), o=objektOf(m); return (safeName(d.nummer)||'xx')+'-Messbericht'+(t.datum?'_'+t.datum:'')+(o.messobjekt?'_'+safeName(o.messobjekt):'')+'.docx'; }
async function buildDocx(m){
  if(!TEMPLATE_BYTES) TEMPLATE_BYTES=b64ToBytes(TEMPLATE_B64);
  const images=[];
  for(const im of (await imgsOf(m.oid)).concat(await imgsOf(m.id))) images.push({bytes:new Uint8Array(await im.blob.arrayBuffer()), width:im.w, height:im.h, caption:im.caption});
  const zip = await buildReportDocx(JSZip, TEMPLATE_BYTES, reportFields(m), images);
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression:'DEFLATE'});
}
async function exportSingle(m){
  await saveCur();
  const miss=missing(m.data,REQUIRED_M);
  if(miss.length && !confirm(miss.length+' Pflichtangabe(n) fehlen noch. Bericht trotzdem erstellen?')) return;
  const s=sheet(`<h3>Bericht wird erstellt …</h3>`,()=>{});
  try{ const blob=await buildDocx(m); s.close(); offerFile(new File([blob], fileName(m), {type:blob.type})); }
  catch(e){ s.close(); alert('Bericht konnte nicht erstellt werden: '+e.message); }
}
async function exportZip(ms){
  if(!ms.length) return;
  const s=sheet(`<h3>ZIP wird erstellt …</h3><p class="muted small" id="zprog" style="margin:0">0 von ${ms.length}</p>`,()=>{});
  try{
    const z=new JSZip(), used=new Set();
    for(let i=0;i<ms.length;i++){
      let n=fileName(ms[i]); while(used.has(n)) n=n.replace(/\.docx$/,'_2.docx'); used.add(n);
      z.file(n, await buildDocx(ms[i]));
      const p=document.getElementById('zprog'); if(p) p.textContent=(i+1)+' von '+ms.length;
    }
    const blob=await z.generateAsync({type:'blob', mimeType:'application/zip'});
    const t=terminOf(ms[0]), oids=new Set(ms.map(m=>m.oid));
    const obj = oids.size===1 && objektOf(ms[0]).messobjekt ? '_'+safeName(objektOf(ms[0]).messobjekt) : '';
    s.close(); offerFile(new File([blob], 'Messberichte_'+(t.datum||today())+obj+'.zip', {type:'application/zip'}));
  }catch(e){ s.close(); alert('ZIP konnte nicht erstellt werden: '+e.message); }
}
// Teilen muss direkt durch einen Tipp ausgelöst werden – daher zweistufig
// Direkt das iOS-Teilen-Menü öffnen („In Dateien sichern“). Lässt iOS das ohne erneuten Tipp
// nicht zu (z. B. wenn das Erstellen zu lange gedauert hat), erscheint ein Knopf dafür.
async function offerFile(file){
  const canShare = navigator.canShare && navigator.canShare({files:[file]});
  if(canShare){
    try{ await navigator.share({files:[file]}); toast('Gespeichert'); return; }
    catch(err){ if(err && err.name==='AbortError') return; }
  }
  offerFileSheet(file, canShare);
}
function offerFileSheet(file, canShare){
  const url = URL.createObjectURL(file);
  sheet(`<h3>${esc(file.name)}</h3>
    <p class="muted small" style="margin:0">${(file.size/1024).toFixed(0)} KB. ${canShare?'Im Teilen-Menü „In Dateien sichern“ wählen.':'Datei wird heruntergeladen.'}</p>
    ${canShare?`<button class="btn primary" data-x="share">In Dateien sichern / Teilen</button>`:''}
    <a class="btn ${canShare?'':'primary'}" href="${url}" download="${esc(file.name)}" style="text-decoration:none" data-x="dl">Herunterladen</a>
    <button class="btn" data-x="close">Fertig</button>`, async (x,close)=>{
      if(x==='share'){ try{ await navigator.share({files:[file]}); toast('Gespeichert'); close(); }catch(e){ if(e.name!=='AbortError') toast('Teilen nicht möglich, bitte „Herunterladen“ nutzen'); } }
      if(x==='close') close();
    });
}

/* ---------- Start ---------- */
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
showHome().catch(e=>{ $('#app').innerHTML='<div class="wrap"><p>Speicher konnte nicht geöffnet werden: '+esc(e.message)+'</p></div>'; });
</script>
