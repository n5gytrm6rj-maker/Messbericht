<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Messbericht">
<meta name="theme-color" content="#eef1f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Messbericht</title>
<style>
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#18212a; --muted:#5d6b78; --line:#cfd6dc;
  --steel:#2c5877; --signal:#ffc400; --signal-ink:#1d1a00; --danger:#b3261e; --ok:#2e7d4f;
  --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#11161b; --panel:#1b232b; --ink:#e8edf1; --muted:#97a6b3; --line:#2f3b46; --steel:#8fb8d6; --danger:#ff8a80; --ok:#7fd1a0;}
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-size:17px; line-height:1.4; -webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--steel); outline-offset:2px}
.wrap{max-width:640px; margin:0 auto; padding:16px 16px 180px}
.bar{display:flex; align-items:center; gap:8px; min-height:48px}
.bar h1{font-size:28px; font-weight:750; letter-spacing:-.02em; margin:0; flex:1}
.bar h2{font-size:17px; font-weight:650; margin:0; flex:1; min-width:0; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.icon-btn{background:none; border:0; padding:10px; min-width:44px; min-height:44px; color:var(--steel); font-weight:600; font-size:17px}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:54px; border-radius:var(--radius); border:1.5px solid var(--line); background:var(--panel); font-weight:650; padding:12px 16px}
.btn.primary{background:var(--signal); color:var(--signal-ink); border-color:transparent}
.btn.steel{background:var(--steel); color:#fff; border-color:transparent}
@media (prefers-color-scheme: dark){.btn.steel{color:#0f1a22}}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.row{display:flex; gap:10px}
.row>*{flex:1}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Liste */
.list{margin:8px 0 0; padding:0; list-style:none; border-top:1px solid var(--line)}
.item{display:flex; align-items:center; gap:12px; padding:14px 2px; border-bottom:1px solid var(--line)}
.item .num{font-variant-numeric:tabular-nums; font-weight:750; font-size:22px; min-width:2.6em}
.item .main{flex:1; min-width:0}
.item .title{display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .meta{display:block; font-size:14px; color:var(--muted)}
.item .open{background:none; border:0; text-align:left; display:flex; gap:12px; align-items:center; flex:1; min-width:0; padding:0}
.check{width:28px; height:28px; border-radius:7px; border:2px solid var(--line); display:grid; place-items:center; flex:none; background:var(--panel)}
.check.on{background:var(--steel); border-color:var(--steel); color:#fff}
.tag{font-size:12px; font-weight:650; padding:2px 7px; border-radius:6px; border:1px solid var(--line); color:var(--muted)}
.tag.done{border-color:var(--ok); color:var(--ok)}
.empty{padding:40px 8px; text-align:center; color:var(--muted)}

/* Fortschritt (iOS-Stil) */
.progress{height:4px; border-radius:2px; background:var(--line); overflow:hidden; margin:4px 0 20px}
.progress-fill{height:100%; border-radius:2px; background:var(--steel); transition:width .25s ease}
/* Maßband-Fortschritt (nicht mehr verwendet) */
.tape{position:relative; height:30px; margin:6px 0 18px; border-radius:4px; background:var(--panel); border:1.5px solid var(--line); overflow:hidden}
.tape .fill{position:absolute; inset:0 auto 0 0; background:var(--signal); transition:width .25s ease}
.tape .ticks{position:absolute; inset:0; display:flex}
.tape .ticks button{flex:1; border:0; background:none; border-right:1px solid rgba(0,0,0,.28); padding:0; position:relative}
.tape .ticks button:last-child{border-right:0}
.tape .ticks button::after{content:""; position:absolute; left:50%; bottom:0; width:1px; height:7px; background:rgba(0,0,0,.28)}
@media (prefers-color-scheme: dark){.tape .ticks button,.tape .ticks button::after{border-color:rgba(255,255,255,.18)} .tape .ticks button::after{background:rgba(255,255,255,.18)}}
.sec{font-size:15px; color:var(--steel); font-weight:650; margin:0}
.q{font-size:27px; font-weight:750; letter-spacing:-.015em; margin:2px 0 18px; line-height:1.15}
.field{margin:0 0 18px}
.field label{display:block; font-weight:600; margin:0 0 6px}
.inp{width:100%; min-height:52px; padding:12px 14px; border-radius:var(--radius); border:1.5px solid var(--line); background:var(--panel); font-size:19px}
textarea.inp{min-height:110px; resize:vertical}
.inp:focus{border-color:var(--steel); outline:none}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.chip{min-height:40px; padding:8px 13px; border-radius:20px; border:1.5px solid var(--line); background:var(--panel); font-size:15px; font-weight:550}
.chip.on{background:var(--steel); color:#fff; border-color:var(--steel)}
@media (prefers-color-scheme: dark){.chip.on{color:#0f1a22}}
.recent{margin-top:10px; font-size:13px; color:var(--muted)}
.compass{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:330px; margin:0 auto 14px}
.compass .chip{border-radius:var(--radius); min-height:64px; font-size:17px; font-weight:700}
.nav{position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.nav .inner{max-width:640px; margin:0 auto; display:flex; gap:10px}
.nav .btn{flex:1}
.nav .btn.back{flex:0 0 26%}
.nav .inner.wiz{flex-direction:column; gap:4px}
.wiz-row{display:flex; gap:8px}
.link-btn{flex:1; min-width:0; display:flex; align-items:center; gap:6px; min-height:44px; padding:0 4px; background:none; border:0; color:var(--steel); font-weight:600; font-size:16px}
.link-btn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.link-btn svg{flex:none; height:18px; width:auto}
.link-btn.right{justify-content:flex-end}
.link-btn:disabled{visibility:hidden}

/* Bilder */
.thumbs{display:grid; gap:14px; margin-top:16px}
.thumb{background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius); padding:10px}
.thumb img{width:100%; display:block; border-radius:6px; background:#fff}
.thumb .row{margin-top:8px; align-items:center}
.thumb .inp{min-height:44px; font-size:16px}

/* Übersicht */
.review h3{font-size:15px; color:var(--steel); margin:22px 0 4px}
.rv{color:inherit; font:inherit; display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:left}
.rv .k{flex:0 0 42%; color:var(--muted); font-size:15px}
.rv .v{flex:1; white-space:pre-wrap; word-break:break-word}
.rv .v.missing{color:var(--danger); font-size:15px}

/* Sheet / Dialog */
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:20}
.sheet{background:var(--bg); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px)); display:grid; gap:10px}
.sheet h3{margin:0 0 4px; font-size:20px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:20px; font-size:15px; z-index:30}

/* Zeichenfläche */
.draw{position:fixed; inset:0; background:var(--bg); z-index:40; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.draw .tools{display:flex; gap:6px; padding:8px; align-items:center; flex-wrap:wrap}
.draw canvas{flex:1; width:100%; touch-action:none; background:#fff; display:block}
.pen{width:36px; height:36px; border-radius:50%; border:3px solid transparent}
.pen.on{border-color:var(--signal); box-shadow:0 0 0 2px var(--ink)}
.pos{display:flex; gap:8px; align-items:center}
.pos .inp{flex:1; min-width:0; font-variant-numeric:tabular-nums}
.seg{display:flex; gap:6px; flex:none}
.seg .chip{min-width:52px; min-height:52px; border-radius:var(--radius); font-size:17px; font-weight:650}
.item > .front{display:flex; align-items:center; gap:12px; flex:1; min-width:0}
.item.swipe{display:block; position:relative; overflow:hidden; padding:0}
.swipe .front{display:flex; align-items:center; gap:12px; padding:14px 2px; background:var(--bg); position:relative; z-index:1; transition:transform .22s ease; touch-action:pan-y}
.swipe .del-btn{position:absolute; top:0; right:0; bottom:0; width:92px; border:0; background:#c62828; color:#fff; font-weight:650; font-size:16px}
.back-btn{display:flex; align-items:center; justify-content:flex-start; padding-left:4px; min-width:56px}
.more-btn{display:flex; align-items:center; justify-content:flex-end; min-width:56px}
details.sek{border-bottom:1px solid var(--line)}
details.sek > summary{list-style:none; display:flex; align-items:center; gap:10px; padding:14px 0; cursor:pointer; min-height:48px}
details.sek > summary::-webkit-details-marker{display:none}
.sek .st{color:var(--steel); font-weight:650; font-size:15px; flex:none}
.sek .sp{flex:1; min-width:0; color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right}
.sek .chev{flex:none; color:var(--muted); transition:transform .2s}
details.sek[open] .chev{transform:rotate(180deg)}
details.sek[open] .sp{visibility:hidden}
details.sek[open]{padding-bottom:8px}
details.sek .rv:last-child{border-bottom:0}
details.sek h4.sub{font-size:13px; font-weight:650; color:var(--muted); margin:16px 0 2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>

<script>// ---- Berichtserstellung: füllt die Word-Vorlage (Platzhalter @@feld@@) ----
function xmlEsc(s) {
  return String(s == null ? '' : s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}
const RPR = '<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/></w:rPr>';
function runsFor(text) {
  const lines = String(text == null ? '' : text).replace(/\r/g, '').split('\n');
  if (lines.length === 1 && lines[0] === '') return '';
  return lines.map((l, i) =>
    '<w:r>' + RPR + (i > 0 ? '<w:br/>' : '') + '<w:t xml:space="preserve">' + xmlEsc(l) + '</w:t></w:r>'
  ).join('');
}
function imageParagraph(rid, idx, wPx, hPx, caption) {
  const maxW = 10466 * 635;            // nutzbare Seitenbreite (EMU)
  const maxH = Math.round(8.6 * 914400); // max. Höhe, damit es auf eine Seite passt
  let cx = maxW, cy = Math.round(maxW * hPx / wPx);
  if (cy > maxH) { cy = maxH; cx = Math.round(maxH * wPx / hPx); }
  const id = 100 + idx;
  const pic =
    '<w:p><w:pPr><w:spacing w:before="120"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing>' +
    '<wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="' + cx + '" cy="' + cy + '"/>' +
    '<wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="' + id + '" name="Bild ' + id + '"/>' +
    '<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>' +
    '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
    '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="' + id + '" name="foto' + idx + '.jpg"/><pic:cNvPicPr/></pic:nvPicPr>' +
    '<pic:blipFill><a:blip r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
    '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>' +
    '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
  const cap = caption ? '<w:p><w:pPr><w:jc w:val="center"/></w:pPr>' + runsFor(caption) + '</w:p>' : '';
  return pic + cap;
}

// fields: {schluessel: text}, images: [{bytes: Uint8Array, width, height, caption}]
async function buildReportDocx(JSZipLib, templateBytes, fields, images) {
  const zip = await JSZipLib.loadAsync(templateBytes);
  let doc = await zip.file('word/document.xml').async('string');
  doc = doc.replace(/@@([a-z_]+)@@/g, (m, key) => key === 'SKIZZE' ? m : runsFor(fields[key]));

  let skizze = '';
  if (images && images.length) {
    let rels = await zip.file('word/_rels/document.xml.rels').async('string');
    images.forEach((img, i) => {
      const n = i + 1, rid = 'rIdFoto' + n;
      zip.file('word/media/foto' + n + '.jpg', img.bytes);
      rels = rels.replace('</Relationships>',
        '<Relationship Id="' + rid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/foto' + n + '.jpg"/></Relationships>');
      skizze += imageParagraph(rid, n, img.width, img.height, img.caption);
    });
    zip.file('word/_rels/document.xml.rels', rels);
  }
  doc = doc.replace('@@SKIZZE@@', skizze);
  zip.file('word/document.xml', doc);
  return zip; // Aufrufer erzeugt blob/uint8array
}

function db(){

    const r = indexedDB.open('messbericht',3);
    r.onupgradeneeded = ()=>{ const d=r.result;
      if(!d.objectStoreNames.contains('messungen')) d.createObjectStore('messungen',{keyPath:'id'});
      if(!d.objectStoreNames.contains('bilder')){ const b=d.createObjectStore('bilder',{keyPath:'id'}); b.createIndex('mid','mid'); }
      if(!d.objectStoreNames.contains('termine')) d.createObjectStore('termine',{keyPath:'id'});
      if(!d.objectStoreNames.contains('objekte')) d.createObjectStore('objekte',{keyPath:'id'});
    };
    r.onsuccess = ()=>{ _db=r.result; res(_db); };
    r.onerror = ()=>rej(r.error);
  });
}
async function tx(store, mode, fn){
  const d = await db();

}

async function migrate(){

    if(!t){
      t = {id:uid(), created:m.created||Date.now(), updated:Date.now(), _migr:true, data:{}};
      TERMIN_KEYS.forEach(k=>{ if(m.data[k]) t.data[k]=m.data[k]; });
      termine.push(t); await put('termine',t);
    }
    m.tid = t.id; await put('messungen',m);
  }
  for(const m of messungen.filter(m=>!m.oid)){
    let o = objekte.find(o=>o.tid===m.tid && (o.data.messobjekt||'')===(m.data.messobjekt||'') && (o.data.zweck||'')===(m.data.zweck||''));

async function compress(blob, max=1800){

  let w=img.naturalWidth, h=img.naturalHeight; const s=Math.min(1, max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);

  return {blob:out, w, h};
}

  ov.innerHTML = `<div class="tools">

    ${colors.map((c,i)=>`<button class="pen ${i===0?'on':''}" style="background:${c}" data-c="${c}" aria-label="Farbe"></button>`).join('')}
    <button class="chip" data-a="w">Dünn</button>
    <button class="icon-btn" data-a="undo">Rückgängig</button>
    <button class="icon-btn" data-a="clear" style="color:var(--danger)">Leeren</button>
    <span style="flex:1"></span>
    <button class="btn primary" style="width:auto;min-height:44px" data-a="ok">Übernehmen</button></div><canvas></canvas>`;
  document.body.appendChild(ov);
  const cv=ov.querySelector('canvas'), g=cv.getContext('2d');
  let strokes=[], curS=null, color=colors[0], width=3;
  const dpr=Math.max(1,window.devicePixelRatio||1);
  function size(){ const r=cv.getBoundingClientRect(); cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); redraw(); }
  function redraw(){ g.setTransform(1,0,0,1,0,0); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.setTransform(dpr,0,0,dpr,0,0); g.lineCap='round'; g.lineJoin='round';
    for(const s of strokes){ g.strokeStyle=s.c; g.lineWidth=s.w; g.beginPath(); s.p.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); if(s.p.length===1) g.lineTo(s.p[0][0]+.1,s.p[0][1]); g.stroke(); } }
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.onpointerdown=e=>{ cv.setPointerCapture(e.pointerId); curS={c:color,w:width,p:[pos(e)]}; strokes.push(curS); redraw(); };
  cv.onpointermove=e=>{ if(!curS) return; curS.p.push(pos(e)); redraw(); };
  cv.onpointerup=cv.onpointercancel=()=>{ curS=null; };
  ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ color=b.dataset.c; ov.querySelectorAll('.pen').forEach(x=>x.classList.toggle('on',x===b)); });
  ov.querySelector('[data-a="w"]').onclick=e=>{ width = width===3?7:3; e.target.textContent = width===3?'Dünn':'Dick'; };
  ov.querySelector('[data-a="undo"]').onclick=()=>{ strokes.pop(); redraw(); };
  ov.querySelector('[data-a="clear"]').onclick=()=>{ if(strokes.length && confirm('Zeichnung leeren?')){ strokes=[]; redraw(); } };
  ov.querySelector('[data-a="cancel"]').onclick=()=>{ if(!strokes.length || confirm('Zeichnung verwerfen?')){ window.removeEventListener('resize',size); ov.remove(); } };
  ov.querySelector('[data-a="ok"]').onclick=async()=>{
    if(!strokes.length){ ov.remove(); return; }
    g.setTransform(1,0,0,1,0,0);
    const blob = await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
    window.removeEventListener('resize',size); ov.remove();
    await addImage(blob,'Skizze'); showStep();
  };
  window.addEventListener('resize',size);
  requestAnimationFrame(size);
}

/* ---------- Wischen zum Löschen (wie in iOS) ---------- */
const DEL_W = 92;
function closeSwipes(except){ document.querySelectorAll('.swipe.open').forEach(li=>{ if(li!==except){ li.classList.remove('open'); li.querySelector('.front').style.transform=''; } }); }
function enableSwipe(){
  document.querySelectorAll('.swipe').forEach(li=>{
    const front=li.querySelector('.front');
    let sx=0, sy=0, dx=0, lock=null, moved=false;
    front.addEventListener('touchstart',e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; dx=0; lock=null; moved=false; front.style.transition='none'; },{passive:true});
    front.addEventListener('touchmove',e=>{
      const t=e.touches[0], mx=t.clientX-sx, my=t.clientY-sy;
      if(lock===null && (Math.abs(mx)>8 || Math.abs(my)>8)) lock = Math.abs(mx)>Math.abs(my) ? 'x' : 'y';
      if(lock!=='x') return;
      e.preventDefault(); moved=true; closeSwipes(li);
      dx = Math.min(0, Math.max(-DEL_W*1.6, (li.classList.contains('open')?-DEL_W:0)+mx));
      front.style.transform=`translateX(${dx}px)`;
    },{passive:false});
    front.addEventListener('touchend',()=>{
      front.style.transition='';
      if(lock!=='x') return;
      const auf = dx < -DEL_W/2;
      li.classList.toggle('open', auf);
      front.style.transform = auf ? `translateX(${-DEL_W}px)` : '';
    });
    // Nach dem Wischen keinen Tipp auslösen; offener Eintrag schließt sich beim Antippen
    front.addEventListener('click',e=>{
      if(moved || li.classList.contains('open')){ e.stopPropagation(); e.preventDefault(); moved=false; if(li.classList.contains('open')){ li.classList.remove('open'); front.style.transform=''; } }
    },true);
    li.querySelector('.del-btn').onclick = async ()=>{
      const ok = await loeschenNachFrage(li.dataset.del, li.dataset.id);
      if(!ok){ li.classList.remove('open'); front.style.transform=''; }
    };
  });
}
async function loeschenNachFrage(typ, id){
  if(typ==='termin'){
    const t=termine.find(x=>x.id===id); if(!t) return false;
    const no=objekteOf(id).length, nm=messungenOfT(id).length;
    if(!confirm('Messtermin '+(fmtDate(t.data.datum)||'')+' mit '+no+' Messobjekt'+(no===1?'':'en')+' und '+nm+' Messung'+(nm===1?'':'en')+' wirklich löschen?')) return false;
    await deleteTermin(t); showHome(); return true;
  }
  if(typ==='objekt'){
    const o=objekte.find(x=>x.id===id); if(!o) return false;
    const nm=messungenOfO(id).length;
    if(!confirm('Messobjekt „'+(o.data.messobjekt||'ohne Namen')+'“ mit '+nm+' Messung'+(nm===1?'':'en')+' wirklich löschen?')) return false;
    await deleteObjekt(o); showTermin(); return true;
  }
  if(typ==='messung'){
    const m=messungen.find(x=>x.id===id); if(!m) return false;
    if(!confirm('Messung '+(m.data.nummer||'')+' wirklich löschen?')) return false;
    await deleteMessung(m); showObjekt(); return true;
  }
  return false;
}

/* ---------- Einklappbare Informationsblöcke ---------- */
const offeneSektionen = new Set();   // bleibt während der Sitzung erhalten
// Wandelt Abschnitte „<h3>Titel</h3> … Zeilen …“ in einklappbare Blöcke um (standardmäßig zu)
function sektionen(prefix, html){
  const teile = html.split(/<h3>(.*?)<\/h3>/);
  let out = teile[0];
  for(let i=1;i<teile.length;i+=2){
    const titel=teile[i], inhalt=teile[i+1]||'', id=prefix+':'+titel;
    const werte=[...inhalt.matchAll(/<span class="v[^"]*">([\s\S]*?)<\/span>/g)].map(m=>m[1].replace(/<[^>]+>/g,'').split('\n')[0].trim()).filter(x=>x && x!=='–' && x!=='fehlt noch');
    const vorschau = werte.slice(0,3).join(', ');
    out += `<details class="sek" data-sek="${esc(id)}" ${offeneSektionen.has(id)?'open':''}><summary><span class="st">${titel}</span><span class="sp">${vorschau}</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>${inhalt}</details>`;
  }
  setTimeout(()=>document.querySelectorAll('details.sek').forEach(d=>d.ontoggle=()=>{ d.open?offeneSektionen.add(d.dataset.sek):offeneSektionen.delete(d.dataset.sek); }),0);
  return out;
}
/* ---------- Abfrage (für Termin, Messobjekt und Messung) ---------- */
function recentValues(k){
  const pool = ({termin:termine, objekt:objekte, messung:messungen})[kind];
  const seen=[]; for(const m of pool.slice().sort((a,b)=>(b.updated||0)-(a.updated||0))){ const v=String(m.data[k]||'').trim(); if(v && !seen.includes(v) && m.id!==cur.id) seen.push(v); if(seen.length>=4) break; } return seen;
}
function fieldHTML(f, single){
  const v = cur.data[f.k]==null?'':cur.data[f.k];
  const id = 'f_'+f.k;
  let h = `<div class="field">${(!single && f.label)?`<label for="${id}">${esc(f.label)}</label>`:''}`;
  if(f.type==='compass'){
    h += `<div class="compass">${COMPASS.map(([s,l])=>{ const val = s==='–'?'windstill':`${l} (${s})`; return `<button class="chip ${v===val?'on':''}" data-set="${f.k}" data-val="${esc(val)}">${s==='–'?'still':s}</button>`; }).join('')}</div>
      <input class="inp" id="${id}" data-k="${f.k}" value="${esc(v)}" placeholder="oder frei eingeben, z. B. drehend" enterkeyhint="next">`;
  } else if(f.type==='textarea'){
    h += `<textarea class="inp" id="${id}" data-k="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  } else if(f.type==='pos'){
    const z=cur.data[f.k+'_z']||'', e=cur.data[f.k+'_e'] || (/ m$/.test(cur.data[f.k]||'') ? 'm' : (f.unitDef||'m'));
    h += `<div class="pos"><input class="inp" id="${id}" data-pos="${f.k}" data-def="${e}" value="${esc(z)}" inputmode="decimal" placeholder="0,00" enterkeyhint="next" autocomplete="off">
      <div class="seg"><button class="chip ${e==='m'?'on':''}" data-unit="${f.k}" data-val="m">m</button><button class="chip ${e==='l'?'on':''}" data-unit="${f.k}" data-val="l" aria-label="mal Länge l">· <i style="font-family:Georgia,serif">l</i></button></div></div>`;
    if(f.quick) h += `<div class="chips">${f.quick.map(q=>`<button class="chip ${z===q&&e==='l'?'on':''}" data-quick="${f.k}" data-val="${q}">${q} · <i style="font-family:Georgia,serif">l</i></button>`).join('')}</div>`;
  } else if(f.chipsOnly){
    /* nur Auswahl per Antippen */
  } else {
    const t = f.type==='date'?'date':f.type==='time'?'time':'text';
    h += `<input class="inp" id="${id}" type="${t}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.mode?`inputmode="${f.mode}"`:''} ${f.pad?`data-pad="${f.pad}"`:''} enterkeyhint="next" autocomplete="off">`;
  }
  if(f.chips){
    const parts = String(v).split(',').map(s=>s.trim());
    h += `<div class="chips">${f.chips.map(c=>`<button class="chip ${(f.toggle?parts.includes(c):v===c)?'on':''}" data-${f.toggle?'tog':'set'}="${f.k}" data-val="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  }
  if(f.hint) h += `<p class="muted small" style="margin:10px 0 0">${esc(f.hint)}</p>`;
  if(istUebernommen(f.k)) h += `<p class="muted small" data-carry="${f.k}" style="margin:8px 0 0">↺ aus vorheriger Messung</p>`;
  if(f.dupCheck){ const n=dateiDoppelt(f.k, v); h += `<p class="small dup-warn" data-warn="${f.k}" style="margin:8px 0 0; color:var(--danger)">${n?'Bereits vergeben in Messung '+esc(n)+' dieses Termins':''}</p>`; }
  if(f.recent){
    const r = recentValues(f.k).filter(x=>x!==v);
    if(r.length) h += `<div class="recent">Zuletzt verwendet</div><div class="chips">${r.map(c=>`<button class="chip" data-set="${f.k}" data-val="${esc(c)}">${esc(c.length>40?c.slice(0,40)+'…':c)}</button>`).join('')}</div>`;
  }
  return h+'</div>';
}

async function showStep(){
  let STEPS = stepsOf(kind), s = STEPS[step];
  if(s && !s.images){ let neu=false; s.fields.forEach(f=>{ if(f.def!==undefined && cur.data[f.k]===undefined){ cur.data[f.k]=f.def; neu=true; } }); if(neu){ await saveCur(); STEPS=stepsOf(kind); s=STEPS[step]; } }
  const pct = Math.round(step/STEPS.length*100);
  const tape = `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${STEPS.length}" aria-valuenow="${step+1}"><div class="progress-fill" style="width:${Math.round((step+1)/STEPS.length*100)}%"></div></div>`;
  let body;
  if(s.images){
    const imgs = await imgsOf(cur.id);
    body = `<p class="muted small">Skizze mit x-/y-Richtung, Untergrund und Abständen zu aufgehenden Bauteilen. Alles hier landet auf Seite 2 des Berichts.</p>
      <div class="row"><button class="btn steel" id="drawBtn">Skizze zeichnen</button><button class="btn steel" id="camBtn">Foto aufnehmen</button></div>
      <button class="btn" id="libBtn" style="margin-top:10px">Aus Mediathek wählen</button>
      <div class="thumbs">${imgs.map((im,i)=>`<div class="thumb"><img data-img="${im.id}" alt="Bild ${i+1}">
        <div class="row"><input class="inp" data-cap="${im.id}" value="${esc(im.caption||'')}" placeholder="Bildunterschrift"><button class="icon-btn" style="flex:0;color:var(--danger)" data-delimg="${im.id}" aria-label="Bild löschen">✕</button></div></div>`).join('')}</div>`;
  } else {
    body = s.fields.map(f=>fieldHTML(f, s.fields.length===1)).join('')
      + (s.now?`<button class="btn" id="nowBtn">Uhrzeit jetzt</button>`:'')
      + (s.today?`<button class="btn" id="todayBtn">Heute</button>`:'');
  }
  const last = step===STEPS.length-1;
  const title = kind==='termin' ? 'Messtermin' : kind==='objekt' ? objektTitel(termin&&termin.data, cur.data) : messungTitel(termin&&termin.data, objekt&&objekt.data, cur.data);
  $('#app').innerHTML = `<div class="wrap">
    <div class="bar"><button class="icon-btn back-btn" id="upBtn" aria-label="Zurück zu ${({termin:'Terminen', objekt:'Termin', messung:'Objekt'})[kind]}">${backIcon()}</button><h2>${esc(title)}</h2><button class="icon-btn" id="revBtn">Übersicht</button></div>
    ${tape}
    <h1 class="q">${esc(s.q)}</h1>
    ${body}
  </div>
  <div class="nav"><div class="inner wiz">
    <div class="wiz-row">
      <button class="link-btn" id="backBtn" ${step===0?'disabled':''} aria-label="Zurück zu ${esc(step>0?STEPS[step-1].q:'')}">${backIcon()}<span>${esc(step>0?STEPS[step-1].q:'')}</span></button>
      <button class="link-btn right" id="skipBtn"><span>Überspringen</span>${skipIcon()}</button>
    </div>
    <button class="btn primary" id="nextBtn">${last?({termin:'Fertig', objekt:'Fertig', messung:'Übersicht'})[kind]:'Weiter'}</button></div></div>`;
  bindStep(s);
  window.scrollTo(0,0);
  if(!s.images){ const first=document.querySelector('.inp'); if(first && !('ontouchstart' in window)) first.focus(); }
}
function finishWizard(){ saveCur().then(()=> kind==='termin' ? showTermin() : kind==='objekt' ? showObjekt() : showReview()); }

function bindStep(s){
  const STEPS = stepsOf(kind);
  $('#upBtn').onclick = ()=> kind==='termin' ? showHome() : kind==='objekt' ? showTermin() : showObjekt();
  $('#revBtn').onclick = finishWizard;
  $('#backBtn').onclick = ()=>{ if(step>0){ step--; saveCur(); showStep(); } };
  $('#nextBtn').onclick = ()=>{
    if(!s.images){
      const doppelt = s.fields.filter(f=>f.dupCheck).map(f=>{ const n=dateiDoppelt(f.k, cur.data[f.k]); return n ? f.label+': '+padNr(cur.data[f.k],4)+' (Messung '+n+')' : null; }).filter(Boolean);
      if(doppelt.length && !confirm('Diese Dateibezeichnung ist im Messtermin schon vergeben:\n'+doppelt.join('\n')+'\n\nTrotzdem weiter?')) return;
    }
    saveCur(); if(step<stepsOf(kind).length-1){ step++; showStep(); } else finishWizard(); };
  // Arduino: Eintrag im ersten Feld gilt auch für die übrigen – solange diese nicht einzeln ausgefüllt wurden
  if(!s.images){
    const gruppe = s.fields.filter(f=>f.spiegel);
    if(gruppe.length>1){
      const erstes = gruppe[0], rest = gruppe.slice(1);
      const v0 = String(cur.data[erstes.k]||'');
      const eigen = new Set(rest.filter(f=>{ const v=String(cur.data[f.k]||''); return v && v!==v0; }).map(f=>f.k));
      const spiegeln = ()=>{ const e0=document.querySelector(`.inp[data-k="${erstes.k}"]`); const v=e0?e0.value:(cur.data[erstes.k]||''); cur.data[erstes.k]=v; rest.forEach(f=>{ if(eigen.has(f.k)) return; cur.data[f.k]=v; const el=document.querySelector(`.inp[data-k="${f.k}"]`); if(el){ el.value=v; el.dispatchEvent(new Event('spiegel')); } }); scheduleSave(); };
      const el0=document.querySelector(`.inp[data-k="${erstes.k}"]`);
      if(el0){ el0.addEventListener('input',spiegeln); el0.addEventListener('blur',()=>setTimeout(spiegeln,0)); }
      rest.forEach(f=>{ const el=document.querySelector(`.inp[data-k="${f.k}"]`); if(el) el.addEventListener('input',()=>{ if(el.value) eigen.add(f.k); else eigen.delete(f.k); }); });
    }
  }
  // Doppelte Arduino-Dateibezeichnungen sofort beim Tippen anzeigen
  document.querySelectorAll('.dup-warn').forEach(p=>{ const el=document.querySelector(`.inp[data-k="${p.dataset.warn}"]`); if(!el) return;
    const upd=()=>{ const n=dateiDoppelt(p.dataset.warn, el.value); p.textContent = n ? 'Bereits vergeben in Messung '+n+' dieses Termins' : ''; };
    el.addEventListener('input',upd); el.addEventListener('spiegel',upd); el.addEventListener('blur',()=>setTimeout(upd,0)); });
  // Seite leer lassen: Eingaben dieser Seite verwerfen und weiter (Bilder bleiben unangetastet)
  $('#skipBtn').onclick = ()=>{
    if(!s.images){
      const keys = s.fields.map(f=>f.k);
      const hat = keys.some(k=>String(cur.data[k]||'').trim());
      if(hat && !confirm('Angaben auf dieser Seite leeren und überspringen?')) return;
      keys.forEach(k=>{ uebernahmeEnde(k); cur.data[k]=''; if(cur.data[k+'_z']!==undefined) cur.data[k+'_z']=''; });
    }
    saveCur(); if(step<stepsOf(kind).length-1){ step++; showStep(); } else finishWizard();
  };
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ step=+b.dataset.go; saveCur(); showStep(); });
  document.querySelectorAll('.inp[data-k]').forEach(el=>{
    el.oninput = ()=>{ uebernahmeEnde(el.dataset.k); cur.data[el.dataset.k]=el.value; scheduleSave(); syncChips(el.dataset.k); };
    el.addEventListener('focus',()=>{ if(istUebernommen(el.dataset.k)) setTimeout(()=>{ try{ el.setSelectionRange(0, el.value.length); }catch(e){ el.select(); } },0); });
    if(el.tagName==='INPUT') el.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); const all=[...document.querySelectorAll('.inp[data-k], .inp[data-pos]')]; const i=all.indexOf(el); if(i<all.length-1) all[i+1].focus(); else $('#nextBtn').click(); } };
  });
  document.querySelectorAll('.inp[data-pad]').forEach(el=>el.addEventListener('blur',()=>{ const p=padNr(el.value,+el.dataset.pad); if(p!==el.value){ el.value=p; cur.data[el.dataset.k]=p; scheduleSave(); } }));
  const setPos = k => { if(!cur.data[k+'_e']){ const el=document.querySelector(`[data-pos="${k}"]`); cur.data[k+'_e']=(el&&el.dataset.def)||'m'; } cur.data[k] = posText(cur.data[k+'_z'], cur.data[k+'_e']); scheduleSave(); };
  document.querySelectorAll('.inp[data-pos]').forEach(el=>{
    el.addEventListener('focus',()=>{ if(istUebernommen(el.dataset.pos)) setTimeout(()=>{ try{ el.setSelectionRange(0, el.value.length); }catch(e){ el.select(); } },0); });
    el.oninput = ()=>{ const k=el.dataset.pos; uebernahmeEnde(k); cur.data[k+'_z']=el.value.replace(/[^0-9.,]/g,''); if(el.value!==cur.data[k+'_z']) el.value=cur.data[k+'_z']; setPos(k); };
    el.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); const all=[...document.querySelectorAll('.inp[data-k], .inp[data-pos]')]; const i=all.indexOf(el); if(i<all.length-1) all[i+1].focus(); else $('#nextBtn').click(); } };
  });
  const syncQuick = k => document.querySelectorAll(`[data-quick="${k}"]`).forEach(x=>x.classList.toggle('on', cur.data[k+'_e']==='l' && cur.data[k+'_z']===x.dataset.val));
  document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{ const k=b.dataset.quick; uebernahmeEnde(k);
    cur.data[k+'_z']=b.dataset.val; cur.data[k+'_e']='l';
    const el=document.querySelector(`[data-pos="${k}"]`); if(el) el.value=b.dataset.val;
    document.querySelectorAll(`[data-unit="${k}"]`).forEach(x=>x.classList.toggle('on', x.dataset.val==='l'));
    setPos(k); syncQuick(k); });
  document.querySelectorAll('.inp[data-pos]').forEach(el=>el.addEventListener('input',()=>syncQuick(el.dataset.pos)));
  document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{ const k=b.dataset.unit; uebernahmeEnde(k); cur.data[k+'_e']=b.dataset.val; document.querySelectorAll(`[data-unit="${k}"]`).forEach(x=>x.classList.toggle('on', x===b)); setPos(k); });
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{ const k=b.dataset.set, val=b.dataset.val; const neu=istUebernommen(k); uebernahmeEnde(k); cur.data[k] = !neu && cur.data[k]===val && b.classList.contains('on') ? '' : val; const inp=document.querySelector(`.inp[data-k="${k}"]`); if(inp) inp.value=cur.data[k]; scheduleSave(); syncChips(k); });
  document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{ const k=b.dataset.tog, val=b.dataset.val; let parts=String(cur.data[k]||'').split(',').map(x=>x.trim()).filter(Boolean); if(istUebernommen(k)){ uebernahmeEnde(k); parts=[val]; } else parts = parts.includes(val)?parts.filter(x=>x!==val):parts.concat(val); cur.data[k]=parts.join(', '); const inp=document.querySelector(`.inp[data-k="${k}"]`); if(inp) inp.value=cur.data[k]; scheduleSave(); syncChips(k); });
  $('#nowBtn') && ($('#nowBtn').onclick = ()=>{ cur.data.uhrzeit=nowTime(); scheduleSave(); showStep(); });
  $('#todayBtn') && ($('#todayBtn').onclick = ()=>{ cur.data.datum=today(); scheduleSave(); showStep(); });
  if(s.images){
    $('#drawBtn').onclick = ()=>openDraw();
    $('#camBtn').onclick = ()=>$('#camIn').click();
    $('#libBtn').onclick = ()=>$('#libIn').click();
    imgsOf(cur.id).then(list=>document.querySelectorAll('[data-img]').forEach(im=>{ const rec=list.find(x=>x.id===im.dataset.img); if(rec) im.src=URL.createObjectURL(rec.blob); }));
    document.querySelectorAll('[data-cap]').forEach(inp=>inp.oninput=async()=>{ const rec=(await imgsOf(cur.id)).find(x=>x.id===inp.dataset.cap); if(rec){ rec.caption=inp.value; await put('bilder',rec); } });
    document.querySelectorAll('[data-delimg]').forEach(b=>b.onclick=async()=>{ if(confirm('Bild löschen?')){ await del('bilder',b.dataset.delimg); showStep(); } });
  }
}
function syncChips(k){
  const v=String(cur.data[k]||''), parts=v.split(',').map(s=>s.trim());
  document.querySelectorAll(`[data-set="${k}"]`).forEach(b=>b.classList.toggle('on', v===b.dataset.val));
  document.querySelectorAll(`[data-tog="${k}"]`).forEach(b=>b.classList.toggle('on', parts.includes(b.dataset.val)));
}

function sheet(inner, onAction){
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog">${inner}</div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.onclick=e=>{ if(e.target===bg) close(); };
  bg.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>onAction(b.dataset.x, close, b));
  return {el:bg, close};
}

/* ---------- Bericht / Export ---------- */
let TEMPLATE_BYTES;
function lines(pairs, extra){ const out=pairs.filter(p=>String(p[1]||'').trim()).map(p=>p[0]+': '+String(p[1]).trim()); if(String(extra||'').trim()) out.push(String(extra).trim()); return out.join('\n'); }
const terminOf = m => (termine.find(t=>t.id===m.tid)||{data:{}}).data;
const objektOf = m => (objekte.find(o=>o.id===m.oid)||{data:{}}).data;
function reportFields(m){
  const d=m.data, t=terminOf(m), o=objektOf(m);
  return { nummer:d.nummer, datum:fmtDate(t.datum), uhrzeit:d.uhrzeit,
    windgeschwindigkeit:t.windgeschwindigkeit, windrichtung:t.windrichtung, temperatur:fmtTemp(t.temperatur),
    firma:t.firma, messleiter:t.messleiter,
    zweck:o.zweck, messobjekt:[o.messobjekt, o.objekt_notizen, d.mess_notizen].filter(x=>String(x||'').trim()).join('\n'), ...geraeteFelder(t,d),
    ...sensorFelder(t,o,d), erregung:erregungText(o,d),
    ergaenzungen: lines([['Zugkraft',zugkraftText(d.zugkraft)],['Personenanzahl',d.personen],['Gewicht',d.gewicht],['Erkennbare Quellen',d.amb_quellen],
      ['Impulshammer',d.hammer_typ],['Anschlagpunkt Impulshammer',d.hammer_ort],['Hammerspitze',d.hammer_spitze]], d.ergaenzungen_sonst),
    notizen: lines([['Spürbarkeit',d.spuerbarkeit],['Sekundäreffekte',d.sekundaer]], d.notizen_sonst) };
}
// Messgeräte aus den beim Termin gewählten Systemen zusammensetzen
function geraeteFelder(t, d){
  const gew = systemeVon(t);
  if(!gew.length) return {geraetetyp:d.geraetetyp, aafilter:d.aafilter, abtastrate:d.abtastrate}; // ältere Messungen
  const mehr = gew.length>1;
  const liste = k => gew.map(x=>[x.name, String(settings.sys[x.id][k]||'').trim()]).filter(p=>p[1])
    .map(([n,v])=> mehr ? n+': '+v : v).join('\n');
  return { geraetetyp: gew.map(x=>String(settings.sys[x.id].geraetetyp||x.name).trim()).join('\n'), aafilter: liste('aafilter'), abtastrate: liste('abtastrate') };
}
// Art der Erregung, bei Personen mit der gewählten Bewegung
function erregungText(o,d){
  const er=erregungenVon(o);
  if(!er.length) return o.erregung||d.erregung||'';
  return er.map(x=> x==='Personen' && d.p_art ? 'Personen ('+d.p_art+')' : x).join(', ');
}
function fileName(m){ const d=m.data, t=terminOf(m), o=objektOf(m); return (safeName(d.nummer)||'xx')+'-Messbericht'+(t.datum?'_'+t.datum:'')+(o.messobjekt?'_'+safeName(o.messobjekt):'')+'.docx'; }
async function buildDocx(m){
  if(!TEMPLATE_BYTES) TEMPLATE_BYTES=b64ToBytes(TEMPLATE_B64);
  const images=[];
  for(const im of (await imgsOf(m.oid)).concat(await imgsOf(m.id))) images.push({bytes:new Uint8Array(await im.blob.arrayBuffer()), width:im.w, height:im.h, caption:im.caption});
  const zip = await buildReportDocx(JSZip, TEMPLATE_BYTES, reportFields(m), images);
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression:'DEFLATE'});
}
async function exportSingle(m){
  await saveCur();
  const miss=missing(m.data,REQUIRED_M);
  if(miss.length && !confirm(miss.length+' Pflichtangabe(n) fehlen noch. Bericht trotzdem erstellen?')) return;
  const s=sheet(`<h3>Bericht wird erstellt …</h3>`,()=>{});
  try{ const blob=await buildDocx(m); s.close(); offerFile(new File([blob], fileName(m), {type:blob.type})); }
  catch(e){ s.close(); alert('Bericht konnte nicht erstellt werden: '+e.message); }
}
async function exportZip(ms){
  if(!ms.length) return;
  const s=sheet(`<h3>ZIP wird erstellt …</h3><p class="muted small" id="zprog" style="margin:0">0 von ${ms.length}</p>`,()=>{});
  try{
    const z=new JSZip(), used=new Set();
    for(let i=0;i<ms.length;i++){
      let n=fileName(ms[i]); while(used.has(n)) n=n.replace(/\.docx$/,'_2.docx'); used.add(n);
      z.file(n, await buildDocx(ms[i]));
      const p=document.getElementById('zprog'); if(p) p.textContent=(i+1)+' von '+ms.length;
    }
    const blob=await z.generateAsync({type:'blob', mimeType:'application/zip'});
    const t=terminOf(ms[0]), oids=new Set(ms.map(m=>m.oid));
    const obj = oids.size===1 && objektOf(ms[0]).messobjekt ? '_'+safeName(objektOf(ms[0]).messobjekt) : '';
    s.close(); offerFile(new File([blob], 'Messberichte_'+(t.datum||today())+obj+'.zip', {type:'application/zip'}));
  }catch(e){ s.close(); alert('ZIP konnte nicht erstellt werden: '+e.message); }
}
// Teilen muss direkt durch einen Tipp ausgelöst werden – daher zweistufig
function offerFile(file){
  const canShare = navigator.canShare && navigator.canShare({files:[file]});
  const url = URL.createObjectURL(file);
  sheet(`<h3>${esc(file.name)}</h3>
    <p class="muted small" style="margin:0">${(file.size/1024).toFixed(0)} KB. ${canShare?'Im Teilen-Menü „In Dateien sichern“ wählen.':'Datei wird heruntergeladen.'}</p>
    ${canShare?`<button class="btn primary" data-x="share">In Dateien sichern / Teilen</button>`:''}
    <a class="btn ${canShare?'':'primary'}" href="${url}" download="${esc(file.name)}" style="text-decoration:none" data-x="dl">Herunterladen</a>
    <button class="btn" data-x="close">Fertig</button>`, async (x,close)=>{
      if(x==='share'){ try{ await navigator.share({files:[file]}); toast('Gespeichert'); close(); }catch(e){ if(e.name!=='AbortError') toast('Teilen nicht möglich, bitte „Herunterladen“ nutzen'); } }
      if(x==='close') close();
    });
}
